# GitHub Pages 自動部署工作流程
# 當推送到 main 分支時，自動建置並部署到 GitHub Pages

name: Deploy to GitHub Pages

on:
  # 當推送到 main 分支時觸發
  push:
    branches: ['main']
  
  # 允許手動觸發
  workflow_dispatch:

# 設定 GITHUB_TOKEN 權限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允許一個並行部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 建置任務
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: npm ci

      # 測試關卡：任何一項失敗就不建置、不部署。
      # 舊版 TypeScript CPU/PPU 測試（tests/cpu、tests/ppu）目前已知失敗且不屬於正式核心，暫時排除。
      - name: Rust core tests
        run: npm run test:rust

      - name: Build WASM for tests
        run: npm run wasm:build

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        env:
          PAGES_DEPLOY: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Check Pages artifact size
        run: |
          size_bytes=$(du -sb dist | cut -f1)
          echo "Pages artifact size: $((size_bytes / 1024 / 1024)) MiB"
          if [ "$size_bytes" -ge 1073741824 ]; then
            echo "::error::The Pages artifact must be smaller than 1 GiB."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  # 部署任務
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
