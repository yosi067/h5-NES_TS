[package]
name = "nes-wasm"
version = "0.1.0"
edition = "2021"
description = "NES 模擬器 WASM 核心 - 使用 Rust 實作高效能 NES 硬體模擬"

[package.metadata.wasm-pack.profile.release]
# 只開啟目前 Rust 輸出本來就用到的 WASM 功能（不提高瀏覽器需求）。
# wasm-pack 內附的 wasm-opt 預設不認得 bulk-memory，未指定時會驗證失敗。
wasm-opt = ["-O3", "--mvp-features", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bincode = "1.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
